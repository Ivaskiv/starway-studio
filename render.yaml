services:
  - type: web
    name: starway-api
    env: node
    region: frankfurt
    plan: starter
    buildCommand: npm install -g pnpm && pnpm install --filter starway-backend && npx prisma generate --schema=./backend/prisma/schema.prisma && cd backend && pnpm run build
    startCommand: cd backend && pnpm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WAYFORPAY_MERCHANT_LOGIN
        sync: false
      - key: WAYFORPAY_MERCHANT_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false

services:
  - type: web
    name: starway-api
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm --filter @starway/db run build && pnpm --filter starway-backend run build
    startCommand: pnpm --filter starway-backend run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WAYFORPAY_MERCHANT_LOGIN
        sync: false
      - key: WAYFORPAY_MERCHANT_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false

services:
  - type: web
    name: starway-api
    env: node
    region: frankfurt
    plan: starter
    buildCommand: npm install && npm run build:backend
    startCommand: npm run start:backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: starway-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: starway-frontend
    env: static
    region: frankfurt
    plan: starter
    buildCommand: npm install && npm run build:frontend
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: starway-db
    databaseName: starway_production
    plan: starter

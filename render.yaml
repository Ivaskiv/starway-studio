services:
  - type: web
    name: starway-api
    env: node
    region: frankfurt
    plan: starter
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WAYFORPAY_MERCHANT_LOGIN
        sync: false
      - key: WAYFORPAY_MERCHANT_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
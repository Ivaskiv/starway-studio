services:
  - type: web
    name: starway-api
    env: node
    region: frankfurt
    plan: starter
    rootDir: backend
    buildCommand: npm install -g pnpm && cd /opt/render/project/src && pnpm install && npx prisma generate --schema=/opt/render/project/src/backend/prisma/schema.prisma && cd backend && pnpm run build
    startCommand: pnpm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WAYFORPAY_MERCHANT_LOGIN
        sync: false
      - key: WAYFORPAY_MERCHANT_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false

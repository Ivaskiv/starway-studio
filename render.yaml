services:
  - type: web
    name: starway-api
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: "npm install -g pnpm && pnpm install && pnpm --dir backend run build"
    startCommand: cd backend && node dist/src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_DELIVERY_MODE
        value: webhook
      - key: TELEGRAM_WEBHOOK_URL
        value: https://starway-api.onrender.com
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WAYFORPAY_MERCHANT
        sync: false
      - key: WAYFORPAY_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: COACH_BOT_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PUBLIC_API_URL
        value: https://starway-api.onrender.com
      - key: FRONTEND_URL
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: WAYFORPAY_CALLBACK_URL
        sync: false
      - key: WAYFORPAY_FOCUS_LANDING_URL
        sync: false
      - key: STARWAY_OPS_CHAT_ID
        sync: false
      - key: FOCUS_TELEGRAM_CHANNEL_INVITE_LINK
        sync: false
      - key: START_TELEGRAM_BOT
        value: "true"

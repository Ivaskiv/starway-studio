services:
  - type: web
    name: starway-api
    runtime: node
    region: frankfurt
    plan: starter
buildCommand: |
  npm install -g pnpm
  pnpm install
  pnpm --filter @starway/db exec prisma generate
  pnpm --filter starway-backend build
  
  startCommand: pnpm --filter starway-backend run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WAYFORPAY_MERCHANT_LOGIN
        sync: false
      - key: WAYFORPAY_MERCHANT_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false

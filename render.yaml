services:
  - type: web
    name: starway-api
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: "npm install -g pnpm && pnpm install && cd backend && npx prisma generate --schema=./prisma/schema.prisma && pnpm run build"
    startCommand: cd backend && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WAYFORPAY_MERCHANT_LOGIN
        sync: false
      - key: WAYFORPAY_MERCHANT_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false

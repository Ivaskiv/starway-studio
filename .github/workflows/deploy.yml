name: CI

on:
  push:
    branches: [main]

jobs:
  backend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies (generates Prisma client and shared/ai exports)
        env:
          PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: "1"
        run: |
          pnpm --filter @starway/shared run build
          pnpm --filter @starway/ai run build
          pnpm --filter @starway/db run build

      - name: Type-check backend
        run: pnpm --dir backend exec tsc --noEmit

name: Migrate and Deploy

on:
  push:
    branches: [main]

jobs:
  migrate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies (generates Prisma client and shared/ai exports)
        env:
          PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: "1"
        run: |
          pnpm --filter @starway/shared run build
          pnpm --filter @starway/ai run build
          pnpm --filter @starway/db run build

      - name: Type-check backend
        run: pnpm --dir backend exec tsc --noEmit

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "DIRECT_URL secret is empty, falling back to DATABASE_URL"
            export DIRECT_URL="$DATABASE_URL"
          fi
          pnpm --filter @starway/db run prisma:migrate:deploy

      - name: Trigger Render deploy
        if: success()
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Wait for new deploy to become healthy
        if: success()
        run: |
          for i in $(seq 1 30); do
            if curl -sf https://starway-api.onrender.com/health/ready > /dev/null; then
              echo "healthy"
              exit 0
            fi
            sleep 10
          done
          echo "health check timed out after 5 minutes"
          exit 1

      - name: Verify Telegram webhook still points at production
        if: success()
        run: |
          WEBHOOK_URL=$(curl -sf "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/getWebhookInfo" | node -e "process.stdin.resume();let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).result.url)}catch(e){console.log('')}})")
          if [ "$WEBHOOK_URL" != "https://starway-api.onrender.com/api/telegram/webhook" ]; then
            echo "webhook mismatch: got '$WEBHOOK_URL'"
            exit 1
          fi
          echo "webhook ok"

      - name: Notify OPS on success
        if: success()
        run: |
          curl -sf -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.STARWAY_OPS_CHAT_ID }}" \
            -d text="✅ Deploy succeeded: migrated, typechecked, healthy, webhook verified. commit ${{ github.sha }}"

      - name: Notify OPS on failure
        if: failure()
        run: |
          curl -sf -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.STARWAY_OPS_CHAT_ID }}" \
            -d text="🚨 Deploy pipeline failed for commit ${{ github.sha }}. Check GitHub Actions logs. Render was NOT updated if migration or typecheck failed before the trigger step."

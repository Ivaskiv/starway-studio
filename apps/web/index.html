<script>
  // CLASSIC_APP_ERROR_PROBE
  window.addEventListener('error', function (event) {
    var el = document.getElementById('classic-app-error')

    if (!el) {
      el = document.createElement('pre')
      el.id = 'classic-app-error'
      el.style.cssText =
        'position:fixed;' +
        'inset:0;' +
        'z-index:2147483647;' +
        'margin:0;' +
        'padding:16px;' +
        'overflow:auto;' +
        'white-space:pre-wrap;' +
        'background:#111827;' +
        'color:#fca5a5;' +
        'font:13px/1.5 monospace;'
      document.documentElement.appendChild(el)
    }

    el.textContent =
      'CLASSIC APP ERROR\n\n' +
      (event.message || 'Unknown error') +
      '\n' +
      (event.filename || '') +
      ':' +
      (event.lineno || 0) +
      ':' +
      (event.colno || 0) +
      '\n\n' +
      (event.error && event.error.stack ? event.error.stack : '')
  })

  window.addEventListener('unhandledrejection', function (event) {
    var el = document.createElement('pre')
    el.style.cssText =
      'position:fixed;inset:0;z-index:2147483647;margin:0;padding:16px;' +
      'overflow:auto;white-space:pre-wrap;background:#111827;color:#fca5a5;' +
      'font:13px/1.5 monospace;'

    var reason = event.reason
    el.textContent =
      'CLASSIC APP REJECTION\n\n' +
      (reason && reason.stack ? reason.stack : String(reason))

    document.documentElement.appendChild(el)
  })
</script>

<script id="telegram-ngrok-app-loader">
  (function () {
    var params = new URLSearchParams(window.location.search);
    var version = params.get('v') || String(Date.now());

    var jsUrl =
      '/telegram-legacy/telegram-webview.js?v=' +
      encodeURIComponent(version);

    fetch(jsUrl, {
      method: 'GET',
      cache: 'no-store',
      headers: {
        'ngrok-skip-browser-warning': '1'
      }
    })
      .then(function (response) {
        if (!response.ok) {
          throw new Error(
            'Telegram bundle HTTP ' +
            response.status +
            ' ' +
            response.statusText
          );
        }

        return response.blob();
      })
      .then(function (blob) {
        var jsBlob = new Blob(
          [blob],
          { type: 'application/javascript' }
        );

        var blobUrl = URL.createObjectURL(jsBlob);

        var script = document.createElement('script');
        script.id = 'telegram-classic-app';
        script.src = blobUrl;
        script.async = false;

        script.onload = function () {
          URL.revokeObjectURL(blobUrl);
        };

        script.onerror = function () {
          URL.revokeObjectURL(blobUrl);
          console.error(
            '[TELEGRAM_CLASSIC_APP_LOAD_FAILED]'
          );
        };

        document.body.appendChild(script);
      })
      .catch(function (error) {
        console.error(
          '[TELEGRAM_NGROK_BOOT_FAILED]',
          error
        );
      });
  })();
</script>
